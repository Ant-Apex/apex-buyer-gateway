# Source compose (tags). CI builds from this; deploy uses docker-compose.pinned.yml
# with sha256 digests — that pinned file is what the TEE measurement covers.
services:
  mux:
    image: apexant/mux@sha256:d77d95bf0c5736c63b6d7cf36cf405b60b102db4ff957d33ea7b87027e9c91aa
    build:
      context: ..
      dockerfile: deploy/Dockerfile.mux
    restart: unless-stopped
    volumes:
      - mux-data:/data
    expose:
      - "8410"
  gw:
    image: apexant/gw@sha256:ce00982c11f0d9b369eae37cb9602c97bf5c7ee7cb5476217edeb24f6b9d0971
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gw
    restart: unless-stopped
    depends_on:
      - mux
    ports:
      - "8420:8420"
volumes:
  mux-data:
  gw-data:
