# Source compose (tags). CI builds from this; deploy uses docker-compose.pinned.yml
# with sha256 digests — that pinned file is what the TEE measurement covers.
services:
  mux:
    image: apexant/mux@sha256:1773ac3f10ad5b5b0f09160b438232e455eccd4d75ba2c660e902377620b9b77
    restart: unless-stopped
    volumes:
      - mux-data:/data
    environment:
      - MUX_DATA_DIR=${MUX_DATA_DIR}
      - MUX_INTERNAL_TOKEN=${MUX_INTERNAL_TOKEN}
      - MUX_LISTEN_HOST=${MUX_LISTEN_HOST}
      - MUX_LISTEN_PORT=${MUX_LISTEN_PORT}
      - MUX_MASTER_KEY=${MUX_MASTER_KEY}
      - GAS_FUNDER_KEY=${GAS_FUNDER_KEY}
      - MUX_RPC_FALLBACKS=${MUX_RPC_FALLBACKS}
      - MUX_RPC_URL=${MUX_RPC_URL}
      - MUX_SELLER_ADDRESS=${MUX_SELLER_ADDRESS}
      - MUX_SELLER_CAPS=${MUX_SELLER_CAPS}
      - MUX_SELLER_PEER_ID=${MUX_SELLER_PEER_ID}
    expose:
      - "8410"
  gw:
    image: apexant/gw@sha256:74a03b21d31e28c277a35decabd503e94a2220d3011beae7d663ebdfa1583878
    restart: unless-stopped
    depends_on:
      - mux
    environment:
      - GW_CATALOG_URL=${GW_CATALOG_URL}
      - GW_DATA_DIR=${GW_DATA_DIR}
      - GW_DEPOSITS_ADDR=${GW_DEPOSITS_ADDR}
      - GW_HMAC_SECRET=${GW_HMAC_SECRET}
      - GW_HOST=${GW_HOST}
      - GW_PORT=${GW_PORT}
      - GW_SITE_ORIGIN=${GW_SITE_ORIGIN}
      - GW_USDC_ADDR=${GW_USDC_ADDR}
      - MUX_INTERNAL_TOKEN=${MUX_INTERNAL_TOKEN}
      - MUX_URL=${MUX_URL}
    ports:
      - "8420:8420"
volumes:
  mux-data:
  gw-data:
