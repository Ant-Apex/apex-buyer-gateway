name: release
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-push-attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: build+push mux
        id: mux
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.mux
          push: true
          tags: apexant/mux:staging
          provenance: false
      - name: build+push gw
        id: gw
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.gw
          push: true
          tags: apexant/gw:staging
          provenance: false
      - name: pin digests + manifest
        run: |
          MUXD="apexant/mux@${{ steps.mux.outputs.digest }}"
          GWD="apexant/gw@${{ steps.gw.outputs.digest }}"
          sed -e "s|image: apexant/mux.*|image: ${MUXD}|" -e "s|image: apexant/gw.*|image: ${GWD}|" deploy/docker-compose.yml > deploy/docker-compose.pinned.yml
          python3 - <<PY
          import json, datetime
          m = {"releasedAt": datetime.datetime.now(datetime.UTC).isoformat(timespec="seconds"),
               "commit": "${{ github.sha }}", "channel": "staging",
               "images": {"mux": "${MUXD}", "gw": "${GWD}"}}
          open("attestation.json", "w").write(json.dumps(m, indent=2) + "\n")
          PY
      - name: commit manifest
        run: |
          git config user.email "ci@apex-ant.net"; git config user.name "apex-ci"
          git add attestation.json deploy/docker-compose.pinned.yml
          git commit -m "release: pin digests for ${{ github.sha }}" || echo "no change"
          git push
      - name: deploy to Phala CVM (manual trigger only; env stays in CVM)
        if: github.event_name == 'workflow_dispatch'
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_API_KEY }}
        run: |
          npm i -g phala >/dev/null 2>&1
          phala deploy --cvm-id apex-staging -c deploy/docker-compose.pinned.yml --wait
